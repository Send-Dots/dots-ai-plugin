name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The MCP server ships from the dots repo, so check for drift daily.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Manifests and schemas
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
      - uses: useblacksmith/setup-python@943b05a7c4ca70c2360391137527a37bee33fb1d # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install -q jsonschema==4.26.0
      - name: Manifests and MCP configs agree
        run: python3 scripts/check_manifests.py
      - name: Agent Plugins schemas
        run: python3 scripts/check_schemas.py
      - name: Claude plugin validation
        run: npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate --strict .

  server-contract:
    name: Live MCP server contract
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
      - uses: useblacksmith/setup-python@943b05a7c4ca70c2360391137527a37bee33fb1d # v6
        with:
          python-version: '3.12'
      - name: Skill matches https://mcp.dots.dev/docs
        run: python3 scripts/check_server_contract.py
